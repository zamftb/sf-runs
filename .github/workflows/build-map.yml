name: Build map

# Runs automatically whenever a GPX file, one of the build scripts, or the
# exclusion-zone list changes on the main branch, and also lets you trigger
# it by hand from the Actions tab (the "workflow_dispatch" line below) if you
# ever want to force a rebuild.
on:
  push:
    branches: [main]
    paths:
      - 'sf-runs/activity_*.gpx'
      - 'sf-runs/scripts/*.py'
      - 'sf-runs/scripts/excluded_zones.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gpxpy folium shapely pyproj

      - name: Regenerate map
        run: |
          cd sf-runs/scripts
          python3 extract.py
          python3 coverage.py
          python3 generate_map.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sf-runs/index.html sf-runs/runs_overlay_map.html sf-runs/scripts/runs.json sf-runs/scripts/coverage.json sf-runs/scripts/excluded_zones.json
          git diff --cached --quiet || git commit -m "Auto-regenerate map from GPX files [skip ci]"
          git push
