name: Build map

# Runs automatically whenever a GPX file or one of the build scripts changes
# inside the sf-runs subfolder (that's the folder published at
# zamft.com/sf-runs/ - the repo root is your separate personal homepage).
# You can also trigger it by hand from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - 'sf-runs/activity_*.gpx'
      - 'sf-runs/scripts/*.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gpxpy folium shapely pyproj

      - name: Regenerate map
        run: |
          cd sf-runs/scripts
          python3 extract.py
          python3 coverage.py
          python3 generate_map.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sf-runs/index.html sf-runs/runs_overlay_map.html sf-runs/scripts/runs.json sf-runs/scripts/coverage.json
          git diff --cached --quiet || git commit -m "Auto-regenerate map from GPX files [skip ci]"
          git push
